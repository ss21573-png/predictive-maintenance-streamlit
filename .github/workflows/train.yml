name: Train model

on:
  push:
    branches: [main]
    paths:
      - "train_model.py"
      - "requirements.txt"
      - ".github/workflows/train.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Train and save model bundle
        run: python train_model.py
      - name: Commit model bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictive_maintenance_model.pkl
          git diff --staged --quiet || git commit -m "Train and save predictive maintenance model"
          git pull --rebase
          git push
